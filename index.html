<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reemo Web Viewer</title>
    <!-- Load official Reemo WebClient script -->
    <script src="https://static.reemo.io/reemo.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .config-panel { background: #1e1e1e; padding: 15px; border-radius: 8px; max-width: 500px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        /* Container required by Reemo.js to render the remote screen */
        #reemodiv { width: 100%; height: 80vh; background: #000; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <div class="config-panel" id="panel">
        <h2>Reemo Quick Connect</h2>
        <label for="apiKey">Secret API Key:</label>
        <input type="password" id="apiKey" placeholder="Enter your Reemo Secret Key">

        <label for="computerId">Computer ID (UUID):</label>
        <input type="text" id="computerId" placeholder="Enter target computer UUID">

        <button onclick="launchSession()">Connect & Stream</button>
    </div>

    <!-- Target div for the remote desktop stream -->
    <div id="reemodiv"></div>

    <script>
        async function launchSession() {
            const apiKey = document.getElementById('apiKey').value;
            const computerId = document.getElementById('computerId').value;

            if (!apiKey || !computerId) {
                alert("Please fill in both fields.");
                return;
            }

            // Hide config panel and show the stream canvas container
            document.getElementById('panel').style.display = 'none';
            document.getElementById('reemodiv').style.display = 'block';

            try {
                // 1. Fetch the authorized computer object/token from Reemo's API
                const response = await fetch(`https://restapi.restapi.reemo.io/v1/computers/${computerId}/connect`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': apiKey
                    }
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const computerData = await response.json();

                // 2. Initialize Reemo WebClient
                const reemo = new Reemo.WebClient();
                
                reemo.on('created', () => {
                    console.log('Reemo WebClient created, connecting...');
                });

                // Initialize inside #reemodiv
                reemo.init('reemodiv', {
                    retryButton: true,
                    backButton: true
                });

                // 3. Pass the fetched computer token payload to establish the WebRTC stream
                reemo.connect(computerData);

            } catch (error) {
                alert("Connection failed: " + error.message);
                document.getElementById('panel').style.display = 'block';
                document.getElementById('reemodiv').style.display = 'none';
            }
        }
    </script>
</body>
</html>
